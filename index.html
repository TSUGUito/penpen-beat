<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ペンペンビート! | PENPEN BEAT!</title>
<meta name="description" content="ペンペンと遊ぶブラウザ音ゲー。インストール不要、開いた3秒後にプレイ!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#3FB6E8; --sky-deep:#1E93C9; --sky-dark:#177AA9;
  --cloud:#D8E9F2; --scarf:#E8402E;
  --beak:#F5C531; --gold:#FFB937; --gold-deep:#E8960F;
  --navy:#33465A; --paper:#FFFDF7;
  --lane1:#FF8FA3; --lane2:#7ED6A5; --lane3:#8EC9FF; --lane4:#FFC24B;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  color:var(--navy);
  transition:background .6s;
}
/* ===== 背景テーマ(タイトル=チェッカー柄/曲別=世界観) ===== */
body.bg-title{
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.10) 0 22px, rgba(255,255,255,0) 22px 44px),
    linear-gradient(180deg,#4FBEEE 0%, #7FD2F4 100%);
}
body.bg-town{
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.10) 0 22px, rgba(255,255,255,0) 22px 44px),
    radial-gradient(circle at 82% 10%, rgba(255,224,110,.85) 0 58px, rgba(255,224,110,.25) 100px, transparent 101px),
    linear-gradient(180deg,#A8E6B8 0%, #D7F5DE 55%, #FFF7DE 100%);
}
body.bg-theme{
  background:
    radial-gradient(ellipse 100px 36px at 18% 20%, #fff 0 60%, transparent 61%),
    radial-gradient(ellipse 130px 44px at 78% 32%, rgba(255,255,255,.95) 0 60%, transparent 61%),
    radial-gradient(ellipse 84px 30px at 52% 10%, rgba(255,255,255,.85) 0 60%, transparent 61%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.07) 0 22px, rgba(255,255,255,0) 22px 44px),
    linear-gradient(180deg,#9AD7F5 0%, #C8EAFB 55%, #FFF3D8 100%);
}
body.bg-lastboss{
  color:#F4EFF7;
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.04) 0 22px, rgba(255,255,255,0) 22px 44px),
    radial-gradient(circle at 50% 118%, rgba(255,90,60,.6) 0 26%, rgba(232,64,46,.2) 46%, transparent 60%),
    linear-gradient(180deg,#2A2140 0%, #40254E 55%, #5A2740 100%);
}
body.bg-medley{ /* 戦闘:燃える夕焼けの決闘 */
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.10) 0 22px, rgba(255,255,255,0) 22px 44px),
    radial-gradient(circle at 50% 116%, rgba(255,110,60,.6) 0 24%, rgba(255,150,80,.25) 44%, transparent 58%),
    linear-gradient(180deg,#FFC96B 0%, #FF9E62 55%, #E86A4E 100%);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:14px;text-align:center;transition:opacity .35s;overflow-y:auto}
.hidden{opacity:0;pointer-events:none}

/* ===== メインパネル(白の大きな角丸ボード) ===== */
.panel{
  background:var(--paper);
  border:4px solid #fff;
  border-radius:28px;
  box-shadow:0 8px 0 rgba(23,90,130,.28), 0 0 0 3px rgba(23,90,130,.12);
  padding:16px 16px 18px;
  display:flex;flex-direction:column;gap:11px;align-items:center;
  max-width:min(94vw,720px);
  color:var(--navy);
}

/* タイトルロゴ(画像) */
.title-logo{
  width:min(90vw,520px);max-height:34vh;object-fit:contain;
  filter:drop-shadow(0 6px 0 rgba(23,90,130,.28));
  animation:logoWobble 3.2s ease-in-out infinite;
}
@keyframes logoWobble{0%,100%{transform:rotate(-1.1deg) translateY(0)}50%{transform:rotate(1.1deg) translateY(-4px)}}

/* リボン風ラベル */
.select-label{
  font-size:12px;font-weight:800;letter-spacing:.28em;color:#fff;
  background:linear-gradient(180deg,#4FC0EE,var(--sky-deep));
  border-radius:999px;padding:4px 26px;
  box-shadow:0 3px 0 var(--sky-dark), inset 0 2px 0 rgba(255,255,255,.5);
}

/* ツヤありボタン(丸文字フォント) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
  font-weight:800;font-size:18px;color:#fff;
  background:linear-gradient(180deg,#FF8A62 0%,var(--scarf) 55%,#D53422 100%);
  border-radius:999px;padding:13px 46px;
  box-shadow:0 5px 0 #A82417, inset 0 3px 0 rgba(255,255,255,.5);
  text-shadow:0 1.5px 0 rgba(0,0,0,.18);
  transition:transform .08s, box-shadow .08s}

/* セクションラベル(ステッカー画像) */
.label-img{height:36px;max-width:60vw;object-fit:contain;
  filter:drop-shadow(0 3px 0 rgba(23,90,130,.25))}

/* ステージ背景ムービー(ボスバトル/街並み) */
#stage-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  z-index:0;opacity:.55;filter:brightness(.55) saturate(1.15);
  pointer-events:none;display:none}
#game.video-mode #stage-bg{display:block}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #A82417, inset 0 3px 0 rgba(255,255,255,.5)}
.btn.ghost{background:linear-gradient(180deg,#FFFFFF,#E9F3F9);color:var(--sky-deep);
  box-shadow:0 5px 0 #B8CEDC, inset 0 2px 0 #fff;text-shadow:none}
.btn.ghost:active{box-shadow:0 1px 0 #B8CEDC, inset 0 2px 0 #fff}
.btn[disabled]{opacity:.5;pointer-events:none}

/* ===== 曲カード(タイル+金枠✓選択) ===== */
.song-row{display:grid;grid-template-columns:repeat(2,minmax(130px,164px));gap:14px;justify-content:center}
@media(min-width:720px){.song-row{grid-template-columns:repeat(4,150px)}}
.song{position:relative;padding:0;background:none;transition:transform .12s}
.song .s-btn{width:100%;display:block;filter:drop-shadow(0 4px 0 rgba(23,90,130,.22))}
.song:hover{transform:translateY(-4px) rotate(-1.2deg)}
.song:active{transform:scale(.94)}
.song.sel .s-btn{
  filter:drop-shadow(0 4px 0 var(--gold-deep)) drop-shadow(0 0 10px rgba(255,185,55,.95));
}
.song.sel::after{
  content:"✓";position:absolute;top:-8px;right:-4px;width:28px;height:28px;
  background:linear-gradient(180deg,#FFD34D,var(--gold));
  border:3px solid #fff;border-radius:50%;
  color:#fff;font-weight:800;font-size:15px;line-height:22px;
  box-shadow:0 2px 0 var(--gold-deep);z-index:2;
}
.song.previewing .s-btn{animation:btnDance .45s ease-in-out infinite}
@keyframes btnDance{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) translateY(-3px)}}

/* ===== 難易度(星の数のみ・文字なし) ===== */
.diff-row{display:flex;gap:11px;flex-wrap:wrap;justify-content:center}
.diff{width:110px;padding:12px 0;border-radius:20px;background:#fff;
  box-shadow:0 4px 0 rgba(23,90,130,.18), 0 0 0 3px #EAF2F8 inset;
  transition:transform .1s;position:relative}
.diff:active{transform:scale(.95)}
.d-stars{display:flex;gap:5px;justify-content:center;align-items:center;min-height:26px}
.d-stars img{width:24px;height:24px;object-fit:contain;filter:drop-shadow(0 2px 0 rgba(23,90,130,.18))}
.diff.sel{
  background:#FFFBEA;
  box-shadow:0 4px 0 var(--gold-deep), 0 0 0 4px var(--gold);
}
.diff.sel .d-stars img{animation:starPop .5s ease-out 1}
@keyframes starPop{0%{transform:scale(.5)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.diff.sel::after{
  content:"✓";position:absolute;top:-10px;right:-8px;width:24px;height:24px;
  background:linear-gradient(180deg,#FFD34D,var(--gold));
  border:3px solid #fff;border-radius:50%;
  color:#fff;font-weight:800;font-size:13px;line-height:18px;
  box-shadow:0 2px 0 var(--gold-deep);
}

.howto{font-size:11.5px;font-weight:700;line-height:1.8;background:#F2FAFF;border-radius:14px;padding:7px 16px;color:var(--navy)}
.howto b{color:var(--scarf)}
.bgm-credit{font-size:10.5px;font-weight:800;color:#fff;opacity:.85;text-shadow:0 1px 0 rgba(23,90,130,.4)}

/* 浮遊音符 */
.float-note{position:fixed;font-size:22px;opacity:.5;color:#fff;pointer-events:none;animation:floatUp linear infinite;z-index:0;text-shadow:0 2px 0 rgba(23,90,130,.25)}
@keyframes floatUp{0%{transform:translateY(105vh) rotate(-10deg)}100%{transform:translateY(-10vh) rotate(14deg)}}
#scr-title>*{z-index:1}

/* ===== ゲーム画面 ===== */
#game{display:block;padding:0}
#hud{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;padding:10px 12px;pointer-events:none}
.hud-box{background:#fff;border-radius:14px;padding:5px 13px;
  box-shadow:0 3px 0 rgba(23,90,130,.22), inset 0 2px 0 rgba(255,255,255,.8);color:var(--navy)}
#score-label{font-size:9.5px;font-weight:800;letter-spacing:.15em;opacity:.6}
#score{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--sky-deep);line-height:1}
#hud-right{display:flex;gap:8px;align-items:center}
#song-diff{font-size:10.5px;font-weight:800;opacity:.7;max-width:34vw}
#btn-quit{pointer-events:auto;width:42px;height:42px;border-radius:50%;
  background:linear-gradient(180deg,#FFFFFF,#E9F3F9);
  box-shadow:0 4px 0 #B8CEDC, inset 0 2px 0 #fff;
  font-size:16px;font-weight:800;color:var(--scarf);line-height:1}
#btn-quit:active{transform:translateY(3px);box-shadow:0 1px 0 #B8CEDC}
#progress-wrap{position:absolute;top:0;left:0;right:0;height:6px;background:rgba(23,90,130,.15);z-index:6}
#progress{height:100%;width:0%;background:linear-gradient(90deg,var(--sky),var(--beak));border-radius:0 4px 4px 0}
#stage{position:absolute;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}

#combo-view{position:absolute;left:50%;top:24%;transform:translateX(-50%);z-index:4;pointer-events:none;text-align:center;opacity:0;transition:opacity .15s}
#combo-num{font-size:clamp(40px,10vw,72px);font-weight:800;color:var(--scarf);text-shadow:2px 2px 0 #fff,-2px 2px 0 #fff,2px -2px 0 #fff,-2px -2px 0 #fff;line-height:1}
#combo-label{font-size:13px;font-weight:800;letter-spacing:.3em;opacity:.75;text-shadow:0 1px 0 #fff}
body.bg-lastboss #combo-label{color:#fff;text-shadow:none}
#judge-pop{position:absolute;left:50%;top:36%;transform:translateX(-50%);z-index:4;pointer-events:none;font-size:clamp(22px,5.5vw,34px);font-weight:800;opacity:0}
#judge-pop.show{animation:judgepop .45s ease-out}
@keyframes judgepop{0%{opacity:0;transform:translateX(-50%) scale(.6)}25%{opacity:1;transform:translateX(-50%) scale(1.15)}60%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) scale(1)}}
.j-perfect{color:var(--beak);text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff,0 0 18px #FFE9A8}
.j-great{color:#2E9E6B;text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff}
.j-good{color:var(--sky-deep);text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff}
.j-miss{color:#98A8B8;text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff}

/* ペンペン */
#penpen-wrap{position:absolute;z-index:5;pointer-events:none;left:6px;bottom:calc(24% + 4px);width:min(24vw,130px)}
@media (min-aspect-ratio:5/6){
  #penpen-wrap{left:auto;right:2.5vw;bottom:auto;top:50%;transform:translateY(-58%);width:min(20vw,200px)}
}
.pp-img{width:100%;display:block;transform-origin:50% 88%}
#pp-glow{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle,#FFE9A8 0%,rgba(255,233,168,0) 65%);opacity:0;transition:opacity .3s;z-index:-1}
.p-happy .pp-img{animation:phappy .55s ease-in-out infinite}
.p-fever .pp-img{animation:pfever .36s ease-in-out infinite}
.p-fever #pp-glow{opacity:.9}
.p-miss .pp-img{animation:pmiss .5s ease-out 1;filter:saturate(.4) brightness(.92)}
@keyframes phappy{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8%) rotate(3deg)}}
@keyframes pfever{0%,100%{transform:translateY(0) rotate(-6deg) scale(1.04)}50%{transform:translateY(-12%) rotate(6deg) scale(1.04)}}
@keyframes pmiss{0%{transform:rotate(0)}25%{transform:rotate(-8deg) translateY(3%)}55%{transform:rotate(6deg)}100%{transform:rotate(0)}}
#bubble{position:absolute;left:58%;top:-16%;min-width:88px;background:#fff;border:3px solid var(--navy);border-radius:16px;padding:6px 10px;font-size:13px;font-weight:800;color:var(--navy);opacity:0;transform:scale(.6);transition:opacity .2s, transform .2s;z-index:2}
#bubble::after{content:"";position:absolute;left:14px;bottom:-11px;border:6px solid transparent;border-top-color:var(--navy)}
#bubble.show{opacity:1;transform:scale(1)}

/* ポーズ */
#pause-overlay{position:fixed;inset:0;z-index:30;background:rgba(23,60,90,.5);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;transition:opacity .2s}
#pause-card{background:var(--paper);border:4px solid #fff;border-radius:26px;padding:26px 30px;
  box-shadow:0 8px 0 rgba(23,90,130,.3);
  display:flex;flex-direction:column;gap:12px;align-items:center;min-width:min(80vw,300px);color:var(--navy)}
#pause-card h2{font-size:20px;font-weight:800}

/* リザルト */
.name-row{display:flex;align-items:center;gap:8px}
.name-label{font-size:12px;font-weight:800;color:#fff;background:var(--sky-deep);border-radius:999px;padding:4px 14px}
#player-name{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
  font-size:15px;font-weight:800;color:var(--navy);text-align:center;
  width:150px;padding:8px 10px;border:3px solid #CFE2EE;border-radius:999px;
  background:#fff;outline:none}
#player-name:focus{border-color:var(--sky)}
























.result-btns{display:flex;flex-direction:column;gap:10px;margin-top:6px;align-items:center}


/* ===== クリア画面(フレーム画像・4:3横長) ===== */
#result-card{position:relative;width:min(94vw,640px);aspect-ratio:4/3;
  overflow:hidden;border-radius:26px;background:#FFF9EF;
  font-size:clamp(8.5px,2.45vw,15px);color:var(--navy);
  box-shadow:0 8px 0 rgba(23,90,130,.25)}
#clear-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  transform:scale(1.02)}
#rc-inner{position:absolute;left:9%;right:7%;top:33%;bottom:8%;
  display:flex;gap:4%;text-align:center;z-index:1}
#rc-left{flex:1.3;min-width:0;display:flex;flex-direction:column;gap:.5em}
#rc-right{flex:1;display:flex;flex-direction:column;align-items:center;gap:.15em}
#result-song{font-size:.8em;font-weight:800;opacity:.55}
#rank{font-size:3.1em;font-weight:800;line-height:1;
  text-shadow:2px 2px 0 #FFF3CF,3px 4px 0 rgba(23,90,130,.15)}
#rank.r-S{color:var(--beak)}#rank.r-A{color:var(--scarf)}#rank.r-B{color:var(--sky-deep)}#rank.r-C{color:#98A8B8}
#result-score{font-size:1.4em;font-weight:800}
#result-msg{font-size:.72em;font-weight:800;color:var(--sky-deep);line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.3em}
.stat{background:#F2FAFF;border-radius:.6em;padding:.35em .1em;box-shadow:inset 0 0 0 2px #E4EFF7}
.stat .s-n{font-size:1em;font-weight:800;font-variant-numeric:tabular-nums}
.stat .s-l{font-size:.52em;font-weight:800;opacity:.55}
.stat.perfect .s-n{color:#D9A400}.stat.great .s-n{color:#2E9E6B}
.stat.good .s-n{color:var(--sky-deep)}.stat.miss .s-n{color:#98A8B8}
#maxcombo-row{font-size:.72em;font-weight:800;opacity:.75}
#new-record{font-size:.68em;font-weight:800;color:#fff;
  background:linear-gradient(180deg,#FFD34D,var(--gold));border-radius:999px;
  padding:.3em 1em;box-shadow:0 2px 0 var(--gold-deep);animation:recPop .5s ease-out 1}
@keyframes recPop{0%{transform:scale(.5)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
#ranking{background:rgba(242,250,255,.9);border-radius:.9em;padding:.5em .6em .35em;
  box-shadow:inset 0 0 0 2px #E4EFF7}
.rk-title{font-size:.68em;font-weight:800;color:var(--sky-deep);margin-bottom:.35em}
#rk-list{list-style:none;display:flex;flex-direction:column;gap:.25em;margin:0;padding:0}
#rk-list li{display:flex;align-items:center;gap:.5em;background:#fff;border-radius:.55em;
  padding:.22em .6em;font-size:.75em;font-weight:800;color:var(--navy)}
#rk-list li .rk-pos{width:1.4em;text-align:center}
#rk-list li .rk-name{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rk-list li .rk-score{font-variant-numeric:tabular-nums}
#rk-list li.me{background:#FFF7DB;box-shadow:0 0 0 2px var(--gold)}
#rk-list li.empty{opacity:.45;justify-content:center}
.rk-note{font-size:.5em;font-weight:700;opacity:.45;margin-top:.3em;text-align:right}

#countdown{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;pointer-events:none}
#count-num{font-size:100px;font-weight:800;color:var(--scarf);text-shadow:3px 3px 0 #fff,-3px 3px 0 #fff,3px -3px 0 #fff,-3px -3px 0 #fff;opacity:0}
#count-num.tick{animation:ctick .95s ease-out 1}
@keyframes ctick{0%{opacity:0;transform:scale(1.6)}20%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
#loading-note{font-size:12px;font-weight:800;color:var(--sky-deep)}
.credit{position:fixed;bottom:6px;left:0;right:0;text-align:center;font-size:9.5px;font-weight:700;opacity:.6;color:#fff;text-shadow:0 1px 0 rgba(23,90,130,.4);pointer-events:none}
@media (prefers-reduced-motion:reduce){
  .p-happy .pp-img,.p-fever .pp-img,.title-logo,.float-note,.song.previewing .s-btn,.diff.sel .d-stars img{animation:none}
}
</style>
</head>
<body class="bg-title">

<!-- ===== タイトル ===== -->
<div class="screen" id="scr-title">
  <img class="title-logo" src="title.webp" alt="ペンペンビート! 音楽リズムゲーム">

  <div class="panel">
    <img class="label-img" src="label_stage.webp" alt="ステージ">
    <div class="song-row" id="song-row"></div>

    <img class="label-img" src="label_level.webp" alt="レベル">
    <div class="diff-row">
      <button class="diff" data-d="easy" aria-label="かんたん"><div class="d-stars"><img src="star.webp" alt=""></div></button>
      <button class="diff sel" data-d="normal" aria-label="ふつう"><div class="d-stars"><img src="star.webp" alt=""><img src="star.webp" alt=""></div></button>
      <button class="diff" data-d="hard" aria-label="むずかしい"><div class="d-stars"><img src="star.webp" alt=""><img src="star.webp" alt=""><img src="star.webp" alt=""></div></button>
    </div>

    <div class="name-row">
      <span class="name-label">なまえ</span>
      <input id="player-name" maxlength="8" placeholder="ゲスト" autocomplete="off">
    </div>
    <button class="btn" id="btn-start">▶ プレイ</button>
    <div id="loading-note" style="display:none">♪ よみこみちゅう…</div>
    <div class="howto">ノーツがラインに重なったらタップ!<br>PC:<b>D・F・J・K</b> / スマホ:<b>レーンをタップ</b></div>
  </div>
  <div class="bgm-credit">BGM:魔王魂</div>
</div>

<!-- ===== ゲーム ===== -->
<div class="screen hidden" id="game">
  <video id="stage-bg" muted loop playsinline preload="auto"></video>
  <div id="progress-wrap"><div id="progress"></div></div>
  <div id="hud">
    <div class="hud-box"><div id="score-label">SCORE</div><div id="score">0</div></div>
    <div id="hud-right">
      <div class="hud-box"><div id="song-diff"></div></div>
      <button id="btn-quit" aria-label="ポーズ">⏸</button>
    </div>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="combo-view"><div id="combo-num">0</div><div id="combo-label">COMBO</div></div>
  <div id="judge-pop"></div>
  <div id="penpen-wrap" class="p-idle">

/* ===== オーディオ ===== */
let AC=null, masterGain=null;
let audioMode="buffer";
let bufferCache={}, curSource=null, songStartAC=0;
let el=null;

function initAudio(){
  if(AC) return;
  AC = new (window.AudioContext||window.webkitAudioContext)();
  masterGain = AC.createGain(); masterGain.gain.value=.85;
  masterGain.connect(AC.destination);
}
/* 最初のタップ/クリックでオーディオ解禁(ホバー試聴用) */
window.addEventListener("pointerdown",()=>{initAudio();if(AC.state==="suspended")AC.resume();},{once:true});

async function loadSong(key){
  if(bufferCache[key]) return bufferCache[key];
  const res = await fetch(SONGS[key].file);
  if(!res.ok) throw new Error("fetch failed");
  const buf = await AC.decodeAudioData(await res.arrayBuffer());
  bufferCache[key]=buf;
  return buf;
}
function songTime(){
  if(audioMode==="buffer") return AC.currentTime - songStartAC;
  return el ? el.currentTime : 0;
}
function stopSong(){
  if(curSource){try{curSource.stop()}catch(e){} curSource=null;}
  if(el){el.pause(); el.currentTime=0;}
}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function playTone(t,midi,dur,type,vol){
  if(!AC)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=mtof(midi);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+.012);
  g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(masterGain);o.start(t);o.stop(t+dur+.05);
}
function playHitSE(q){
  if(!AC)return;
  const t=AC.currentTime;
  const midi=q==="perfect"?96:q==="great"?91:86;
  playTone(t,midi,.1,"triangle",q==="perfect"?.35:.24);
  if(q==="perfect")playTone(t,midi+7,.09,"triangle",.18);
}

let jingleSrc=null, jingleEl=null;
async function playClearJingle(){
  stopClearJingle();
  try{
    if(!bufferCache["__clear"]){
      const res=await fetch("songs/clear_jingle.mp3");
      if(!res.ok)throw new Error("fetch failed");
      bufferCache["__clear"]=await AC.decodeAudioData(await res.arrayBuffer());
    }
    if(state!=="result")return;
    const g=AC.createGain();g.gain.value=.8;
    jingleSrc=AC.createBufferSource();
    jingleSrc.buffer=bufferCache["__clear"];
    jingleSrc.connect(g);g.connect(masterGain);
    jingleSrc.start();
  }catch(e){
    jingleEl=jingleEl||new Audio("songs/clear_jingle.mp3");
    jingleEl.volume=.8;jingleEl.currentTime=0;
    jingleEl.play().catch(()=>{});
  }
}
function stopClearJingle(){
  if(jingleSrc){try{jingleSrc.stop()}catch(e){} jingleSrc=null;}
  if(jingleEl)jingleEl.pause();
}

/* ===== 試聴プレビュー ===== */
let pvSource=null, pvGain=null, pvEl=null, pvToken=0, pvKey=null;
async function startPreview(key){
  if(state!=="title") return;
  if(pvKey===key) return;
  stopPreview();
  pvKey=key;
  const token=++pvToken;
  markPreviewing(key,true);
  initAudio();
  if(AC.state==="suspended"){try{await AC.resume()}catch(e){}}
  if(AC.state!=="running"){markPreviewing(key,false);pvKey=null;return;} // 未操作時は再生不可(ブラウザ仕様)
  try{
    const buf=await loadSong(key);
    if(token!==pvToken) return;
    pvGain=AC.createGain();
    pvGain.gain.setValueAtTime(0,AC.currentTime);
    pvGain.gain.linearRampToValueAtTime(.55,AC.currentTime+.25);
    pvGain.connect(masterGain);
    pvSource=AC.createBufferSource();
    pvSource.buffer=buf;
    pvSource.connect(pvGain);
    const offset=Math.min(buf.duration*.3, Math.max(0,buf.duration-10));
    pvSource.start(0,offset);
    setTimeout(()=>{if(token===pvToken)stopPreview()},8000); // 8秒で自動停止
  }catch(e){ // file:// フォールバック
    if(token!==pvToken) return;
    pvEl=pvEl||new Audio();
    pvEl.src=SONGS[key].file;
    pvEl.volume=.55;
    pvEl.currentTime=0;
    pvEl.play().catch(()=>{});
    setTimeout(()=>{if(token===pvToken)stopPreview()},8000);
  }
}
function stopPreview(){
  pvToken++;
  if(pvKey)markPreviewing(pvKey,false);
  pvKey=null;
  if(pvSource){
    try{
      pvGain.gain.linearRampToValueAtTime(0,AC.currentTime+.15);
      const s=pvSource;setTimeout(()=>{try{s.stop()}catch(e){}},180);
    }catch(e){}
    pvSource=null;pvGain=null;
  }
  if(pvEl){pvEl.pause();}
}
function markPreviewing(key,on){
  const b=document.querySelector(`.song[data-k="${key}"]`);
  if(b)b.classList.toggle("previewing",on);
}

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const fieldW=Math.min(W*.92,520);
  fieldL=(W-fieldW)/2;fieldR=fieldL+fieldW;
  laneW=fieldW/4;
  laneX=[0,1,2,3].map(i=>fieldL+laneW*i);
  judgeY=H*.78;
}

/* ===== ゲーム開始 ===== */
async function startGame(){
  stopPreview();
  initAudio();
  if(AC.state==="suspended") await AC.resume();
  const btn=$("btn-start"), ld=$("loading-note");
  btn.disabled=true; ld.style.display="block";
  let buf=null;
  try{
    buf=await loadSong(songKey);
    audioMode="buffer";
  }catch(e){
    audioMode="element";
    el=el||new Audio();
    el.src=SONGS[songKey].file;
    el.preload="auto";
    await new Promise(r=>{el.oncanplaythrough=r; el.onerror=r; el.load();});
  }
  btn.disabled=false; ld.style.display="none";

  document.body.className="bg-"+songKey;
  theme=THEMES[songKey];
  // ステージ背景ムービー(音声なし)。再生開始は曲スタートと同時
  const STAGE_BG={lastboss:"boss_bg.mp4", town:"town_bg.mp4", medley:"battle_bg.mp4", theme:"adventure_bg.mp4"};
  const stageBg=$("stage-bg");
  if(STAGE_BG[songKey]){
    const src=STAGE_BG[songKey];
    if(!stageBg.src.endsWith(src)) stageBg.src=src;
    $("game").classList.add("video-mode");
    stageBg.pause();
    stageBg.currentTime=0;
  }else{
    $("game").classList.remove("video-mode");
    stageBg.pause();
  }
  $("scr-title").classList.add("hidden");
  $("scr-result").classList.add("hidden");
  $("game").classList.remove("hidden");
  $("song-diff").textContent=`${SONGS[songKey].name} / ${DIFF[diffKey].label}`;

  const meta=CHARTS[songKey];
  songDur=meta.dur;
  chart=meta.charts[diffKey];
  speed=DIFF[diffKey].speed;
  noteIdx=0;activeNotes=[];
  score=0;combo=0;maxCombo=0;
  counts={perfect:0,great:0,good:0,miss:0};
  particles=[];laneFlash=[0,0,0,0];
  updateScore();updateCombo();
  setPenpen("idle");say("いくよ〜!");

  state="count";
  const cn=$("count-num");
  let c=3;
  const step=()=>{
    if(state!=="count")return; // ポーズ画面から戻った等の保険
    if(c>0){
      cn.textContent=c;
      cn.classList.remove("tick");void cn.offsetWidth;cn.classList.add("tick");
      playTone(AC.currentTime,84,.15,"square",.25);
      c--;setTimeout(step,900);
    }else{
      cn.textContent="";
      playTone(AC.currentTime,96,.25,"square",.3);
      if($("game").classList.contains("video-mode")){
        $("stage-bg").currentTime=0;
        $("stage-bg").play().catch(()=>{});
      }
      if(audioMode==="buffer"){
        curSource=AC.createBufferSource();
        curSource.buffer=buf;
        curSource.connect(masterGain);
        curSource.onended=()=>{if(state==="play")finishGame();};
        songStartAC=AC.currentTime+.15;
        curSource.start(songStartAC);
      }else{
        el.onended=()=>{if(state==="play")finishGame();};
        el.currentTime=0;el.play();
      }
      state="play";
    }
  };
  step();
  cancelAnimationFrame(rafId);
  loop();
}

/* ===== 判定 ===== */
function hitLane(lane){
  if(state!=="play")return;
  laneFlash[lane]=1;
  const now=songTime();
  let best=-1,bestDiff=Infinity;
  for(let i=0;i<activeNotes.length;i++){
    const n=activeNotes[i];
    if(n.lane!==lane||n.hit)continue;
    const d=Math.abs(n.time-now);
    if(d<bestDiff){bestDiff=d;best=i;}
  }
  if(best<0||bestDiff>JUDGE.good)return;
  const n=activeNotes[best];n.hit=true;
  const q=bestDiff<=JUDGE.perfect?"perfect":bestDiff<=JUDGE.great?"great":"good";
  counts[q]++;combo++;
  if(combo>maxCombo)maxCombo=combo;
  score+=SCORE_VAL[q];
  spawnParticles(lane,q);playHitSE(q);showJudge(q);
  updateScore();updateCombo();reactPenpen();
}
function missNote(){
  counts.miss++;combo=0;
  updateCombo();showJudge("miss");
  setPenpenTemp("miss",600);
  if(counts.miss%4===1)say(["あわわ…","ドンマイ!","つぎつぎ!"][Math.floor(Math.random()*3)]);
}
function showJudge(q){
  const e=$("judge-pop");
  e.className="";e.classList.add("j-"+q);
  e.textContent=q==="perfect"?"PERFECT!":q==="great"?"GREAT!":q==="good"?"GOOD":"MISS…";
  void e.offsetWidth;e.classList.add("show");
}
function updateScore(){$("score").textContent=score.toLocaleString()}
function updateCombo(){
  $("combo-num").textContent=combo;
  $("combo-view").style.opacity=combo>=3?1:0;
}

/* ===== ペンペン反応 ===== */
const wrap=$("penpen-wrap");
function setPenpen(m){wrap.className="p-"+m}
function setPenpenTemp(m,ms){
  setPenpen(m);clearTimeout(penpenTimer);
  penpenTimer=setTimeout(reactPenpen,ms);
}
function reactPenpen(){
  if(combo>=30)setPenpen("fever");
  else if(combo>=8)setPenpen("happy");
  else setPenpen("idle");
  if(combo===10)say("いいね!");
  else if(combo===25)say("ノリノリ〜!");
  else if(combo===50)say("サイコー!!");
  else if(combo===100)say("しんじられない!!");
}
function say(t){
  const b=$("bubble");
  b.textContent=t;b.classList.add("show");
  clearTimeout(bubbleTimer);
  bubbleTimer=setTimeout(()=>b.classList.remove("show"),1400);
}

/* ===== パーティクル ===== */
function spawnParticles(lane,q){
  const x=laneX[lane]+laneW/2,y=judgeY;
  const n=q==="perfect"?14:q==="great"?9:5;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=2+Math.random()*4;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,
      c:q==="perfect"?"#F5C531":LANE_COLORS[lane],r:3+Math.random()*3});
  }
}

/* ===== 入力 ===== */
window.addEventListener("keydown",e=>{
  const i=KEYS.indexOf(e.code);
  if(i>=0){e.preventDefault();hitLane(i);}
});
cv.addEventListener("touchstart",e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.clientX<fieldL||t.clientX>fieldR)continue;
    hitLane(Math.min(3,Math.max(0,Math.floor((t.clientX-fieldL)/laneW))));
  }
},{passive:false});
cv.addEventListener("mousedown",e=>{
  if(e.clientX<fieldL||e.clientX>fieldR)return;
  hitLane(Math.min(3,Math.max(0,Math.floor((e.clientX-fieldL)/laneW))));
});

/* ===== メインループ ===== */
function loop(){
  rafId=requestAnimationFrame(loop);
  ctx.clearRect(0,0,W,H);
  drawField();
  if(state==="pause"){drawParticles();return;}
  if(state!=="play"){drawParticles();return;}
  const now=songTime();
  const travel=(judgeY+80)/(speed*H);
  while(noteIdx<chart.length&&chart[noteIdx][0]<now+travel+.5){
    const c=chart[noteIdx++];
    activeNotes.push({time:c[0],lane:c[1],hit:false,missed:false});
  }
  for(const n of activeNotes){
    if(n.hit||n.missed)continue;
    const dt=n.time-now;
    if(demoMode&&dt<=0.012&&dt>-0.05){hitLane(n.lane);continue;}
    if(dt<-JUDGE.good){n.missed=true;missNote();continue;}
    drawNote(n.lane,judgeY-dt*speed*H);
  }
  activeNotes=activeNotes.filter(n=>(!n.hit&&!n.missed)||(n.time-now)>-1);
  drawParticles();
  $("progress").style.width=Math.min(100,now/songDur*100)+"%";
  if(now>songDur+2&&noteIdx>=chart.length)finishGame();
}
function drawField(){
  ctx.fillStyle=theme.field;
  ctx.fillRect(fieldL-6,0,(fieldR-fieldL)+12,H);
  for(let i=0;i<4;i++){
    if(laneFlash[i]>0){
      ctx.fillStyle=hexA(LANE_COLORS[i],laneFlash[i]*.28);
      ctx.fillRect(laneX[i],0,laneW,H);
      laneFlash[i]=Math.max(0,laneFlash[i]-.08);
    }
    ctx.strokeStyle=theme.line;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(laneX[i],0);ctx.lineTo(laneX[i],H);ctx.stroke();
  }
  ctx.beginPath();ctx.moveTo(fieldR,0);ctx.lineTo(fieldR,H);ctx.stroke();
  ctx.fillStyle=theme.line;
  ctx.fillRect(fieldL-6,judgeY-4,(fieldR-fieldL)+12,8);
  for(let i=0;i<4;i++){
    const cx=laneX[i]+laneW/2;
    ctx.strokeStyle=LANE_COLORS[i];ctx.lineWidth=3.5;
    ctx.beginPath();ctx.arc(cx,judgeY,Math.min(laneW*.34,30),0,Math.PI*2);ctx.stroke();
    ctx.fillStyle=theme.label;
    ctx.font="800 13px sans-serif";ctx.textAlign="center";
    ctx.fillText(KEY_LABELS[i],cx,judgeY+Math.min(laneW*.34,30)+18);
  }
}
function drawNote(lane,y){
  const cx=laneX[lane]+laneW/2,r=Math.min(laneW*.32,28);
  ctx.fillStyle="rgba(51,70,90,.15)";
  ctx.beginPath();ctx.ellipse(cx,y+r*.55,r*.9,r*.35,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=LANE_COLORS[lane];
  ctx.beginPath();ctx.arc(cx,y,r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.65)";
  ctx.beginPath();ctx.arc(cx-r*.3,y-r*.3,r*.28,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,.9)";ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(cx,y,r-2,0,Math.PI*2);ctx.stroke();
}
function drawParticles(){
  for(const p of particles){
    p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.life-=.03;
    if(p.life<=0)continue;
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  particles=particles.filter(p=>p.life>0);
}
function hexA(hex,a){
  const n=parseInt(hex.slice(1),16);
  return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;
}

/* ===== リザルト ===== */
function finishGame(){
  state="result";
  stopSong();
  $("stage-bg").pause();
  cancelAnimationFrame(rafId);
  const max=chart.length*SCORE_VAL.perfect;
  const rate=max>0?score/max:0;
  const rank=rate>=.95?"S":rate>=.85?"A":rate>=.7?"B":"C";
  $("rank").textContent=rank;$("rank").className="r-"+rank;
  $("result-song").textContent=`${SONGS[songKey].name} / ${DIFF[diffKey].label}`;
  $("result-score").textContent=score.toLocaleString();
  $("result-msg").textContent=
    rank==="S"?"かんぺき!ペンペンも大よろこび!!":
    rank==="A"?"すごい!あと少しでパーフェクト!":
    rank==="B"?"いいかんじ!リズムつかめてきた!":
    "まずは★1でウォームアップしよ!";
  $("st-p").textContent=counts.perfect;
  $("st-g").textContent=counts.great;
  $("st-o").textContent=counts.good;
  $("st-m").textContent=counts.miss;
  $("st-c").textContent=maxCombo;
  // スコア記録+ランキング表示(デモプレイは記録しない)
  const nr=$("new-record");
  if(demoMode){
    nr.style.display="none";
    renderTop3(songKey,diffKey,null);
  }else{
    const entry={n:playerName(), s:score, r:rank, d:Date.now()};
    const pos=recordScore(songKey,diffKey,entry);
    if(pos>=0&&pos<3){
      nr.textContent=pos===0?"🏆 1位にランクイン!":`🏅 ${pos+1}位にランクイン!`;
      nr.style.display="inline-block";
    }else{
      nr.style.display="none";
    }
    renderTop3(songKey,diffKey,entry);
  }
  $("game").classList.add("hidden");
  $("scr-result").classList.remove("hidden");
  const cb=$("clear-bg");
  if(cb){cb.currentTime=0;cb.play().catch(()=>{});}
  playClearJingle();
}
</script>
